version: '3.8'

services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: paisley-highland-games
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - MONGODB_URI=mongodb://admin:paisley_admin_2025@mongodb:27017/paisley_highland_games?authSource=admin
      - REDIS_URL=redis://redis:6379
    depends_on:
      - mongodb
      - redis
    networks:
      - paisley_network
    restart: unless-stopped

  mongodb:
    image: mongo:6.0
    container_name: paisley_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: paisley_admin_2025
      MONGO_INITDB_DATABASE: paisley_highland_games
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - paisley_network

  redis:
    image: redis:7-alpine
    container_name: paisley_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - paisley_network

volumes:
  mongodb_data:
  redis_data:

networks:
  paisley_network:
    driver: bridge